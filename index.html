<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Unggah Klausul Kontrak</title>
<style>
  :root{
    --tinta:#0f2a33;
    --kepala:#14313d;
    --teal:#127885;
    --teal-gelap:#0e626d;
    --hijau:#1fa259;
    --hijau-gelap:#178a4b;
    --garis:#e3e7ea;
    --abu:#6b7a82;
    --latar:#eef1f2;
    --merah:#b3261e;
    --radius:12px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh;
    display:grid; place-items:center;
    background:var(--latar);
    font-family:"Segoe UI",Arial,Helvetica,sans-serif;
    color:var(--tinta);
  }

  .btn{
    border:0; border-radius:10px; cursor:pointer;
    font-size:15px; font-weight:600; font-family:inherit;
    padding:12px 20px; display:inline-flex; align-items:center; gap:9px;
    transition:background .15s ease, box-shadow .15s ease;
  }
  .btn:focus-visible{outline:3px solid #7fd3de; outline-offset:2px}
  .btn[disabled]{opacity:.65; cursor:progress}
  .btn-teal{background:var(--teal); color:#fff}
  .btn-teal:hover{background:var(--teal-gelap)}
  .btn-hijau{background:var(--hijau); color:#fff}
  .btn-hijau:hover{background:var(--hijau-gelap)}
  .btn-netral{background:#fff; color:var(--tinta); border:1.5px solid var(--garis)}
  .btn-netral:hover{background:#f5f7f8}

  /* ---- Lapisan dialog ---- */
  #overlay{
    position:fixed; inset:0; z-index:50;
    background:rgba(15,42,51,.55);
    display:grid; place-items:center; padding:20px;
    opacity:0; transition:opacity .16s ease;
  }
  #overlay.tampil{opacity:1}
  .kartu{
    width:min(700px,100%); background:#fff;
    border-radius:var(--radius); overflow:hidden;
    box-shadow:0 24px 60px rgba(15,42,51,.28);
    transform:translateY(8px) scale(.99);
    transition:transform .16s ease;
  }
  #overlay.tampil .kartu{transform:none}

  .kepala{
    background:var(--kepala); color:#fff;
    padding:20px 24px; display:flex; align-items:center; justify-content:space-between;
  }
  .kepala h2{margin:0; font-size:19px; letter-spacing:.2px}
  .tutup{
    background:none; border:0; color:#cfe0e5; cursor:pointer;
    font-size:22px; line-height:1; padding:4px 6px; border-radius:6px;
  }
  .tutup:hover{color:#fff; background:rgba(255,255,255,.12)}

  .badan{padding:24px; border-bottom:1px solid var(--garis)}
  .baris{display:flex; align-items:center; gap:16px; flex-wrap:wrap}
  .label{color:var(--abu); font-size:15px}
  select{
    font:inherit; padding:11px 14px; border-radius:10px;
    border:1.5px solid var(--garis); background:#fff; color:var(--tinta);
    min-width:230px;
  }
  .terunggah{
    margin-top:18px; color:var(--hijau-gelap); font-size:15px;
    display:flex; gap:8px; align-items:flex-start; line-height:1.45;
  }
  .terunggah b{font-weight:700}
  .galat{
    margin-top:14px; color:var(--merah); font-size:14px;
    background:#fdeceb; border-radius:8px; padding:10px 12px;
  }

  .kaki{
    padding:18px 24px; display:flex; align-items:center;
    justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .meta{color:var(--abu); font-size:14px}
  .aksi{display:flex; gap:12px; margin-left:auto}

  /* ---- Toast: pengganti pop-up kedua ---- */
  #toast{
    position:fixed; left:50%; bottom:28px; z-index:80;
    transform:translate(-50%,14px);
    background:var(--kepala); color:#fff;
    padding:13px 22px; border-radius:999px; font-size:15px;
    box-shadow:0 10px 30px rgba(15,42,51,.3);
    opacity:0; pointer-events:none; transition:opacity .18s ease, transform .18s ease;
  }
  #toast.tampil{opacity:1; transform:translate(-50%,0)}

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important}
  }
</style>
</head>
<body>

<button class="btn btn-teal" id="btn-buka">Unggah klausul kontrak</button>

<div id="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="judul-dialog">
  <div class="kartu">
    <div class="kepala">
      <h2 id="judul-dialog">Unggah Klausul Kontrak</h2>
      <button class="tutup" id="btn-tutup" type="button" aria-label="Tutup">&times;</button>
    </div>

    <div class="badan">
      <div class="baris">
        <button class="btn btn-teal" id="btn-template" type="button">
          &#11015; Download Template (.docx)
        </button>
        <span class="label">Tata letak</span>
        <select id="tata-letak">
          <option>Surat Perintah Kerja</option>
          <option>Surat Perjanjian</option>
          <option>Adendum Kontrak</option>
        </select>
      </div>

      <div class="terunggah" id="baris-terunggah" hidden>
        <span>&#10003;</span>
        <span>Terunggah: <b id="nama-berkas"></b></span>
      </div>

      <div class="galat" id="galat" hidden></div>
    </div>

    <div class="kaki">
      <span class="meta">A4 &middot; Portrait &middot; Margin Normal (2,54 cm) &middot; Arial 11</span>
      <div class="aksi">
        <button class="btn btn-netral" id="btn-batal" type="button">Batal</button>
        <button class="btn btn-hijau" id="btn-simpan" type="button">Simpan</button>
      </div>
    </div>
  </div>
</div>

<input type="file" id="input-berkas" accept=".docx" hidden />
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ===== Isi berkas ini identik dengan app.js ===== */
const state = { open:false, layout:"Surat Perintah Kerja", fileName:null, saving:false };

const overlay = document.getElementById("overlay");
const btnBuka = document.getElementById("btn-buka");
const btnTutup = document.getElementById("btn-tutup");
const btnBatal = document.getElementById("btn-batal");
const btnSimpan = document.getElementById("btn-simpan");
const btnTemplate = document.getElementById("btn-template");
const inputBerkas = document.getElementById("input-berkas");
const pilihanTataLetak = document.getElementById("tata-letak");
const barisTerunggah = document.getElementById("baris-terunggah");
const namaBerkas = document.getElementById("nama-berkas");
const wadahToast = document.getElementById("toast");

let pemicuTerakhir = null;

function bukaDialog(){
  pemicuTerakhir = document.activeElement;
  state.open = true;
  overlay.hidden = false;
  requestAnimationFrame(() => overlay.classList.add("tampil"));
  document.body.style.overflow = "hidden";
  btnTemplate.focus();
}

function tutupDialog(){
  state.open = false;
  overlay.classList.remove("tampil");
  document.body.style.overflow = "";
  setTimeout(() => { overlay.hidden = true; }, 160);
  if (pemicuTerakhir) pemicuTerakhir.focus();
}

/* ====== BAGIAN YANG BERUBAH ======
   Tidak ada confirm() dan tidak ada dialog konfirmasi kedua.
   Alur: simpan → tutup dialog → toast.            */
async function simpan(){
  if (state.saving) return;
  if (!state.fileName){
    tampilkanGalat("Pilih berkas .docx terlebih dahulu.");
    return;
  }

  state.saving = true;
  btnSimpan.disabled = true;
  btnSimpan.textContent = "Menyimpan…";

  try{
    await kirimKeServer({ layout: state.layout, fileName: state.fileName });
    tutupDialog();
    tampilkanToast("Klausul tersimpan");
    resetForm();
  }catch(err){
    tampilkanGalat("Gagal menyimpan. Periksa koneksi lalu coba lagi.");
    console.error(err);
  }finally{
    state.saving = false;
    btnSimpan.disabled = false;
    btnSimpan.textContent = "Simpan";
  }
}

function kirimKeServer(payload){
  return new Promise(resolve => setTimeout(() => resolve(payload), 600));
}

function tampilkanToast(pesan){
  wadahToast.textContent = pesan;
  wadahToast.classList.add("tampil");
  clearTimeout(wadahToast._timer);
  wadahToast._timer = setTimeout(() => wadahToast.classList.remove("tampil"), 2600);
}

function tampilkanGalat(pesan){
  const el = document.getElementById("galat");
  el.textContent = pesan;
  el.hidden = false;
  clearTimeout(el._timer);
  el._timer = setTimeout(() => { el.hidden = true; }, 4000);
}

function resetForm(){
  state.fileName = null;
  inputBerkas.value = "";
  barisTerunggah.hidden = true;
}

btnBuka.addEventListener("click", bukaDialog);
btnTutup.addEventListener("click", tutupDialog);
btnBatal.addEventListener("click", tutupDialog);

btnSimpan.addEventListener("click", (e) => { e.preventDefault(); simpan(); });
btnTemplate.addEventListener("click", () => inputBerkas.click());

inputBerkas.addEventListener("change", (e) => {
  const berkas = e.target.files[0];
  if (!berkas) return;
  state.fileName = berkas.name;
  namaBerkas.textContent = berkas.name;
  barisTerunggah.hidden = false;
});

pilihanTataLetak.addEventListener("change", (e) => { state.layout = e.target.value; });

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && state.open && !state.saving) tutupDialog();
});
overlay.addEventListener("mousedown", (e) => {
  if (e.target === overlay && !state.saving) tutupDialog();
});
</script>
</body>
</html>
